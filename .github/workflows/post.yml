name: Post to Telegram

on:
  schedule:
    # 08:00-22:00 Asia/Qyzylorda (UTC+5) каждые 2 часа = 03,05,07,09,11,13,15,17 UTC
    - cron: "0 3,5,7,9,11,13,15,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write .env
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env

      - name: Run poster
        run: python post.py

      - name: Commit updated history
        run: |
          git config user.name "telegram-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "Update post history [skip ci]"
          git push
