name: Post to Telegram

on:
  schedule:
    # Окно 08:00-22:00 Asia/Qyzylorda (UTC+5) = 03:00-17:59 UTC.
    # Бесплатный cron GitHub роняет большинство тиков, поэтому тикаем каждые 20 минут
    # (:07/:27/:47, не на границе часа), а post.py сам постит не чаще раза в ~2 часа.
    - cron: "7,27,47 3-17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write .env
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env

      - name: Run poster
        env:
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python post.py

      - name: Commit updated history
        run: |
          git config user.name "telegram-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "Update post history [skip ci]"
          git push
